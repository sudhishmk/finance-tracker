quarkus.datasource.db-kind=sqlite
# SQLite file
quarkus.datasource.jdbc.url=jdbc:sqlite:finance.db

# Small pool
quarkus.datasource.jdbc.min-size=1


# Disable aggressive isolation
quarkus.datasource.jdbc.transactions=disabled

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

quarkus.http.cors=true
quarkus.http.cors.origins=http://localhost:5173
quarkus.http.cors.methods=GET,POST,PUT,DELETE

quarkus.log.level=INFO
quarkus.log.category."com.sudhi".level=DEBUG
quarkus.log.console.json=true
quarkus.log.console.level=INFO

quarkus.rest-client.openai.url=${finance.ai.base-url}


# AI properties

finance.ai.provider=${FINANCE_AI_PROVIDER:openai-compatible}
finance.ai.model=${FINANCE_AI_MODEL:ibm-granite/granite-3.3-8b-instruct}
finance.ai.base-url=${FINANCE_AI_BASE_URL:https://granite-3-3-8b-instruct--apicast-production.apps.int.stc.ai.prod.us-east-1.aws.paas.redhat.com:443}
finance.ai.api-key=${FINANCE_AI_API_KEY:cb964f8ae8d1b6bedb1cfd1e75c3a3e9}
finance.ai.temperature=${FINANCE_AI_TEMPERATURE:0.2}
finance.ai.max-tokens=${FINANCE_AI_MAX_TOKENS:800}
quarkus.rest-client.openai.url=${finance.ai.base-url}



##################################################
# DEV ONLY
# Set to true only for proxy / local truststore issue (Not for productions)
##################################################

quarkus.tls.trust-all=true




